name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Chrome for Testing, because Google Chrome 137 and later ignore --load-extension and the extension run needs it.
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm test
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - if: failure()
        run: |
          ps -eo pid,ppid,pgid,etime,args | grep -iE 'chrome|node' | grep -v grep || true
          for d in /tmp/abf-*/; do echo "== $d"; find "$d" -newer "$d" -maxdepth 3 | head -40; done
